<header class="site-header">
    <a class="brand" routerLink="/" aria-label="Credify home">
      <span class="brand-mark">✓</span>
      <span>Credify</span><i></i>
    </a>
  
    <nav class="main-nav" aria-label="Main navigation">
      <a routerLink="/search" routerLinkActive="active">Explore</a>
      <a routerLink="/how-it-works" routerLinkActive="active">How Credify Works</a>
      <a routerLink="/" fragment="featured">Categories</a>
    </nav>
    <form class="nav-search" (submit)="$event.preventDefault(); search()">
      <span aria-hidden="true">⌕</span>
      <input name="headerSearch" type="search" [(ngModel)]="searchText" placeholder="Search reviews & companies..." aria-label="Search reviews and companies">
      <button type="submit" aria-label="Search">→</button>
    </form>
  
    <label class="nav-search">
      <span aria-hidden="true">⌕</span>
      <input type="search" placeholder="Search reviews & companies..." aria-label="Search reviews and companies">
      <kbd>⌘K</kbd>
    </label>
  
    <div class="nav-actions">
      <a class="sign-in" routerLink="/sign-in">Sign In</a>
      <a class="button button-primary join-button" routerLink="/register">Join Credify</a>
      <button class="avatar-button" type="button" aria-label="Profile menu">☺</button>
    </div>
  </header>
