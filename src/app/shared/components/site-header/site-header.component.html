<header class="site-header">
  <a class="brand" routerLink="/" aria-label="Credify home">
    <span class="brand-mark">✓</span>
    <span>Credify</span>
  </a>

  <nav class="main-nav" aria-label="Main navigation">
    <a routerLink="/search" routerLinkActive="active">Explore Reviews</a>
    <a routerLink="/how-it-works" routerLinkActive="active">How Credify Works</a>
  </nav>

  <form class="nav-search" (submit)="$event.preventDefault(); search()">
    <span aria-hidden="true">⌕</span>
    <input name="headerSearch" type="search" [(ngModel)]="searchText" placeholder="Search reviews..." aria-label="Search reviews">
    <button type="submit" aria-label="Search">→</button>
  </form>

  <div class="nav-actions">
    <ng-container *ngIf="!auth.isAuthenticated()">
      <a class="sign-in" routerLink="/sign-in">Sign In</a>
      <a class="button button-primary join-button" routerLink="/register">Join Credify</a>
    </ng-container>

    <ng-container *ngIf="auth.isAuthenticated()">
      <a class="button button-primary" [routerLink]="auth.isAdmin() ? '/admin/reviews' : '/user/dashboard'">
        Dashboard ({{ auth.getUserFullName() }})
      </a>
      <button class="button button-light" (click)="logout()">Sign Out</button>
    </ng-container>
  </div>
</header>
