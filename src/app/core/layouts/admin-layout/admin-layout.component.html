  <div class="portal-main-area">

      <div class="topbar-left">
        <span class="system-status-indicator">
          <span class="status-dot"></span>
          <span class="status-text">Integrity Engine <b>Active</b></span>
        </span>
      </div>
      <div class="topbar-right">
        <a routerLink="/admin/reviews" class="topbar-action-pill" routerLinkActive="pill-active">

        </a>
        <a routerLink="/admin/reports" class="topbar-action-pill" routerLinkActive="pill-active">

        </a>
        <a routerLink="/admin/users" class="topbar-action-pill" routerLinkActive="pill-active">

        </a>
        <a routerLink="/search" class="topbar-site-link">

      <div class="content-container">
        <router-outlet></router-outlet>
      </div>
    </main>
